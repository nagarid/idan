# ============================================================
# Kafka Connect Worker: connect-distributed.properties
# VULNERABLE CONFIGURATION — annotated for research
# ============================================================
# This file shows a typical connect-distributed.properties that
# lacks critical hardening controls, enabling multiple findings.
#
# FINDING-003: plugin.path follows symlinks without boundary check
# FINDING-004: REST API has no authentication (port 8083 open)
# FINDING-010: connector.client.config.override.policy defaults to All
#              and inter-worker requests have no signing requirement
# ============================================================

# ---- Kafka cluster connection ----
bootstrap.servers=b-1.MSK-CLUSTER.REGION.kafka.amazonaws.com:9098

# ---- Worker group ID ----
# All workers with the same group.id form a Connect cluster.
# FINDING-010: The group assignment topic (__connect-configs) can be written
# by any principal with WRITE ACL on internal topics — the assignment is not
# cryptographically signed, so a forged assignment can override leader status.
group.id=connect-cluster

# ---- Internal topic configuration ----
config.storage.topic=__connect-configs
offset.storage.topic=__connect-offsets
status.storage.topic=__connect-status

config.storage.replication.factor=3
offset.storage.replication.factor=3
status.storage.replication.factor=3

# ---- REST API ----
# FINDING-004 VULNERABILITY: REST API listens on all interfaces with no auth.
# Comment below shows what's missing; the default is equivalent to 0.0.0.0:8083.
#
# VULNERABLE (default):
rest.port=8083
# listeners=HTTP://:8083       # effectively open to all interfaces
#
# SECURE (what should be here):
# listeners=HTTP://127.0.0.1:8083   # restrict to localhost
# rest.advertised.host.name=connect-internal.vpc.local
# rest.extension.classes=org.apache.kafka.connect.rest.basic.auth.extension.BasicAuthSecurityRestExtension

# ---- Plugin loading ----
# FINDING-003 VULNERABILITY: plugin.path follows symlinks without boundary checking.
# An attacker who can create a symlink anywhere inside /opt/kafka/plugins/ can
# point it to an arbitrary JAR outside this directory. PluginUtils.pluginUrls()
# uses Files.walkFileTree with FOLLOW_LINKS — no boundary enforcement.
plugin.path=/opt/kafka/plugins

# ---- Config providers ----
# FINDING-004 / CVE-2024-31141 amplification:
# FileConfigProvider and EnvVarConfigProvider allow connectors to read
# arbitrary files (${file:/etc/shadow:root}) and environment variables
# (${env:AWS_SECRET_ACCESS_KEY}) via connector configuration syntax.
#
# VULNERABLE (present):
config.providers=file,env
config.providers.file.class=org.apache.kafka.common.config.provider.FileConfigProvider
config.providers.env.class=org.apache.kafka.common.config.provider.EnvVarConfigProvider
config.providers.file.param.allowed.paths=/opt/kafka/config
#
# SECURE (what should be here):
# config.providers=         # empty string — disable all auto-providers
# OR set the JVM property:  -Dorg.apache.kafka.automatic.config.providers=none

# ---- Connector client config override ----
# FINDING-010 / FINDING-003 VULNERABILITY:
# Defaults to "All" — connectors can override worker-level SASL JAAS config,
# security protocol, and other settings at the connector level.
# This is the primary enabler for CVE-2023-25194 and CVE-2025-27818 class attacks.
#
# VULNERABLE (default, line not present = "All"):
# connector.client.config.override.policy=All   # implicit default
#
# SECURE (what should be here):
# connector.client.config.override.policy=None

# ---- Inter-worker request signing ----
# FINDING-010 VULNERABILITY:
# Without request signing, worker-to-worker forwarded requests (leader forwards
# to workers for task assignment) cannot be authenticated. A worker that
# forges leader status can issue unsigned requests that other workers obey.
#
# VULNERABLE (default — signing not enforced):
# inter.worker.verification.algorithms=   # empty = no signing
#
# SECURE (what should be here):
# inter.worker.verification.algorithms=HmacSHA256
# inter.worker.key.generation.algorithm=HmacSHA256
# inter.worker.key.size=32
# inter.worker.key.ttl.ms=3600000

# ---- Converters ----
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false

# ---- Offset flush ----
offset.flush.interval.ms=10000

# ---- Security (MSK IAM) ----
security.protocol=SASL_SSL
sasl.mechanism=AWS_MSK_IAM
sasl.jaas.config=software.amazon.msk.auth.iam.IAMLoginModule required;
sasl.client.callback.handler.class=software.amazon.msk.auth.iam.IAMOAuthBearerLoginCallbackHandler

# FINDING-001 NOTE: The IAM token generated by IAMOAuthBearerLoginCallbackHandler
# has a 15-minute TTL (SigV4 X-Amz-Expires=900). However, the MSK broker
# never validates lifetimeMs() server-side. A captured token can be replayed
# indefinitely — until the TCP connection drops or the underlying AWS credentials
# are rotated. Rotating credentials does NOT immediately invalidate active sessions.

# ---- Producer/consumer settings for internal topics ----
producer.security.protocol=SASL_SSL
producer.sasl.mechanism=AWS_MSK_IAM
producer.sasl.jaas.config=software.amazon.msk.auth.iam.IAMLoginModule required;
producer.sasl.client.callback.handler.class=software.amazon.msk.auth.iam.IAMOAuthBearerLoginCallbackHandler

consumer.security.protocol=SASL_SSL
consumer.sasl.mechanism=AWS_MSK_IAM
consumer.sasl.jaas.config=software.amazon.msk.auth.iam.IAMLoginModule required;
consumer.sasl.client.callback.handler.class=software.amazon.msk.auth.iam.IAMOAuthBearerLoginCallbackHandler
