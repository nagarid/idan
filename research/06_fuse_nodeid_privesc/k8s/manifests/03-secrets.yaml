# The exploit triggers when two secrets contain the same value.
# A content-addressed CSI driver assigns the same FUSE nodeid to both.
# MD5("ProdDevKey#7x9\n")[:8] = 0x651b3722d014767b  ← colliding nodeid
apiVersion: v1
kind: Secret
metadata:
  name: dev-shared-key
  namespace: cve-demo
  annotations:
    access-policy: "dev-sa can read — mode=0644 in CSI volume"
type: Opaque
stringData:
  value: "ProdDevKey#7x9\n"
---
apiVersion: v1
kind: Secret
metadata:
  name: prod-db-password
  namespace: cve-demo
  annotations:
    access-policy: "app-sa only — mode=0000 in CSI volume, RBAC denies dev-sa"
type: Opaque
stringData:
  value: "ProdDevKey#7x9\n"
